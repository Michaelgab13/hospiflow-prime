<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HospitFlow - Módulo HIS Operativo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/shared/kernel.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">

    <nav class="bg-teal-800 text-white p-4 shadow-lg flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <a href="/" class="text-teal-200 hover:text-white"><i class="fa-solid fa-house"></i></a>
            <span class="font-bold text-lg">HOSPITFLOW (HIS) - Censo, Camas & Operaciones</span>
        </div>
        <span class="bg-teal-900 text-teal-200 text-xs px-3 py-1 rounded-full font-mono">Sincronizado en Vivo</span>
    </nav>

    <main class="max-w-7xl mx-auto p-6 space-y-6">
        
        <!-- Sección 1: Censo de Camas y Pacientes -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-xl font-bold mb-4 text-slate-800"><i class="fa-solid fa-bed text-teal-600 mr-2"></i>1. Administración de Ocupación y Camas</h2>
            <div id="pacientesContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Dinámico -->
            </div>
        </section>

        <!-- Sección 2: Control Operativo del Personal y Especialistas -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-xl font-bold mb-4 text-slate-800"><i class="fa-solid fa-user-clock text-teal-600 mr-2"></i>2. Control Operativo del Personal y Especialistas</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <!-- Formulario con Validación Numérica de Horario -->
                <form id="formTurno" class="space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <h3 class="font-bold text-sm text-slate-700"><i class="fa-solid fa-user-plus mr-1"></i> Registrar Nuevo Especialista</h3>
                    <input type="text" id="nombrePersonal" placeholder="Nombre (Ej. Dr. Carlos Ruiz)" required class="w-full bg-white border border-slate-300 rounded-lg p-2 text-sm">
                    <input type="text" id="rolPersonal" placeholder="Especialidad (Ej. Cardiología)" required class="w-full bg-white border border-slate-300 rounded-lg p-2 text-sm">
                    
                    <!-- Campo de horario con placeholder explicativo -->
                    <div>
                        <input type="text" id="horarioPersonal" placeholder="Horario numérico (Ej. 08:00 - 16:00)" required class="w-full bg-white border border-slate-300 rounded-lg p-2 text-sm">
                        <p class="text-[10px] text-slate-400 mt-1">Formato requerido: HH:MM - HH:MM (Ej: 08:00 - 16:00)</p>
                    </div>

                    <select id="dispPersonal" class="w-full bg-white border border-slate-300 rounded-lg p-2 text-sm">
                        <option value="Disponible">Disponible</option>
                        <option value="En Consulta">En Consulta</option>
                        <option value="En Cirugía">En Cirugía</option>
                        <option value="Fuera de Turno">Fuera de Turno</option>
                    </select>
                    <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold py-2 rounded-lg transition">Registrar Especialista</button>
                </form>

                <!-- Listado de Especialistas -->
                <div id="personalContainer" class="space-y-3 overflow-y-auto max-h-80 pr-1">
                    <!-- Dinámico -->
                </div>
            </div>
        </section>

    </main>

    <script>
        function renderHospitFlow() {
            // Renderizar Pacientes
            const container = document.getElementById('pacientesContainer');
            if (container && SystemKernel.state.pacientes) {
                container.innerHTML = SystemKernel.state.pacientes.map(p => `
                    <div class="p-4 border rounded-xl ${p.estado === 'Alta Médica' ? 'bg-slate-50 border-slate-200 opacity-60' : p.triaje === 'Rojo' ? 'bg-red-50 border-red-200' : 'bg-white border-slate-200'}">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-base">${p.nombre} (${p.id})</span>
                            <span class="px-2.5 py-1 rounded-full text-xs font-bold ${p.triaje === 'Rojo' ? 'bg-red-600 text-white' : 'bg-amber-500 text-white'}">${p.triaje}</span>
                        </div>
                        <p class="text-xs text-slate-600 mt-2">Ubicación: <strong>${p.cama}</strong> | Estado: <span class="font-semibold text-teal-700">${p.estado}</span></p>
                        <p class="text-xs text-slate-500 mt-1">Diagnóstico: ${p.diagnostico}</p>
                        ${p.estado !== 'Alta Médica' ? `
                            <button onclick="SystemKernel.darDeAltaPaciente('${p.id}')" class="mt-3 bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1.5 rounded-lg font-bold transition">
                                <i class="fa-solid fa-check mr-1"></i> Dar de Alta Médica
                            </button>
                        ` : '<span class="inline-block mt-3 text-xs text-emerald-600 font-bold"><i class="fa-solid fa-circle-check"></i> Proceso Finalizado</span>'}
                    </div>
                `).join('');
            }

            // Renderizar Personal
            const pContainer = document.getElementById('personalContainer');
            if (pContainer && SystemKernel.state.personal) {
                pContainer.innerHTML = SystemKernel.state.personal.map(per => `
                    <div class="p-3 bg-white border border-slate-200 rounded-xl text-xs space-y-2 shadow-sm">
                        <div class="flex justify-between items-center">
                            <div>
                                <span class="font-bold text-slate-800 text-sm">${per.nombre}</span>
                                <p class="text-slate-500">${per.rol} | <i class="fa-regular fa-clock mr-1"></i><strong>${per.horario}</strong></p>
                            </div>
                            <span class="px-2.5 py-1 rounded font-bold text-[10px] ${
                                per.disponibilidad === 'Disponible' ? 'bg-emerald-100 text-emerald-800' :
                                per.disponibilidad === 'En Cirugía' ? 'bg-red-100 text-red-800' : 'bg-amber-100 text-amber-800'
                            }">${per.disponibilidad}</span>
                        </div>
                        <div class="flex items-center space-x-1 pt-1 border-t border-slate-100">
                            <span class="text-[10px] text-slate-400 mr-1">Modificar Estado:</span>
                            <button onclick="SystemKernel.actualizarDisponibilidadPersonal(${per.id}, 'Disponible')" class="px-2 py-0.5 bg-emerald-600 text-white text-[10px] rounded font-semibold">Disponible</button>
                            <button onclick="SystemKernel.actualizarDisponibilidadPersonal(${per.id}, 'En Consulta')" class="px-2 py-0.5 bg-blue-600 text-white text-[10px] rounded font-semibold">Consulta</button>
                            <button onclick="SystemKernel.actualizarDisponibilidadPersonal(${per.id}, 'En Cirugía')" class="px-2 py-0.5 bg-red-600 text-white text-[10px] rounded font-semibold">Cirugía</button>
                        </div>
                    </div>
                `).join('');
            }
        }

        // Validación estricta del formato de hora numérico (Ej: 08:00 - 16:00)
        document.getElementById('formTurno').addEventListener('submit', (e) => {
            e.preventDefault();
            const nombre = document.getElementById('nombrePersonal').value;
            const rol = document.getElementById('rolPersonal').value;
            const horario = document.getElementById('horarioPersonal').value;
            const disponibilidad = document.getElementById('dispPersonal').value;

            // Validación Regex para asegurar formato numérico de horas (HH:MM - HH:MM)
            const regexHorario = /^([0-1]?[0-9]|2[0-3]):([0-5][0-9])\s*-\s*([0-1]?[0-9]|2[0-3]):([0-5][0-9])$/;
            
            if (!regexHorario.test(horario)) {
                alert('⚠️ Formato de horario inválido. Por favor ingrese los valores numéricos correctos en formato HH:MM - HH:MM (Ej: 08:00 - 16:00).');
                return; // Detiene el envío si no es válido
            }

            SystemKernel.agregarTurnoPersonal(nombre, rol, horario, disponibilidad);
            e.target.reset();
            alert('¡Especialista registrado con éxito y horario validado!');
        });

        window.addEventListener('kernelUpdated', renderHospitFlow);
        document.addEventListener('DOMContentLoaded', renderHospitFlow);
    </script>
</body>
</html>
