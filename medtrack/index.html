<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedTrack - Módulo ECE & Órdenes Clínicas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/shared/kernel.js"></script>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen">

    <nav class="bg-blue-900 p-4 border-b border-blue-800 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <a href="/" class="text-blue-200 hover:text-white"><i class="fa-solid fa-house"></i></a>
            <span class="font-bold text-lg">MEDTRACK (ECE) - Expediente & Órdenes Clínicas</span>
        </div>
        <span class="bg-blue-950 text-blue-300 text-xs px-3 py-1 rounded-full font-mono"><i class="fa-solid fa-file-medical mr-1"></i> Módulo Médico Activo</span>
    </nav>

    <main class="max-w-7xl mx-auto p-6 space-y-6">
        
        <!-- Formulario de Admisión -->
        <section class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-sm">
            <h2 class="text-lg font-bold mb-4 text-blue-400"><i class="fa-solid fa-user-plus mr-2"></i>Admisión y Triaje de Paciente</h2>
            <form id="formPaciente" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="text" id="nombreInput" placeholder="Nombre del Paciente" required class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
                <select id="triajeInput" class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
                    <option value="Rojo">Rojo (Emergencia)</option>
                    <option value="Amarillo">Amarillo (Urgente)</option>
                    <option value="Verde">Verde (Leve)</option>
                </select>
                <input type="text" id="camaInput" placeholder="Cama (Ej. Cama 103)" required class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
                <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg p-2.5 text-sm transition">Registrar Ingreso</button>
            </form>
        </section>

        <!-- Listado con Perfiles Expandibles y Órdenes Clínicas -->
        <section class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-sm">
            <h2 class="text-xl font-bold mb-4 text-blue-400"><i class="fa-solid fa-clipboard-user mr-2"></i>Pacientes Activos y Órdenes Médicas</h2>
            <div id="triajeContainer" class="space-y-4">
                <!-- Dinámico -->
            </div>
        </section>

    </main>

    <script>
        function renderMedTrack() {
            const container = document.getElementById('triajeContainer');
            if (container && SystemKernel.state.pacientes) {
                container.innerHTML = SystemKernel.state.pacientes.map(p => `
                    <div class="p-4 bg-slate-900 rounded-xl border border-slate-700 space-y-3">
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-2">
                            <div>
                                <div class="flex items-center space-x-3">
                                    <h3 class="font-bold text-lg">${p.nombre}</h3>
                                    <span class="text-xs text-slate-400 font-mono">ID: ${p.id}</span>
                                    <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${p.triaje === 'Rojo' ? 'bg-red-600 text-white' : p.triaje === 'Amarillo' ? 'bg-amber-500 text-white' : 'bg-emerald-600 text-white'}">${p.triaje}</span>
                                </div>
                                <p class="text-xs text-slate-400 mt-1">Ubicación: <strong>${p.cama}</strong> | Estado: <span class="text-teal-400">${p.estado}</span></p>
                            </div>

                            <div class="flex items-center space-x-2">
                                <span class="text-xs text-slate-400 mr-1">Cambiar Triaje:</span>
                                <button onclick="SystemKernel.actualizarTriaje('${p.id}', 'Rojo')" class="px-2 py-1 bg-red-600 hover:bg-red-700 text-white text-xs font-bold rounded">Rojo</button>
                                <button onclick="SystemKernel.actualizarTriaje('${p.id}', 'Amarillo')" class="px-2 py-1 bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold rounded">Amarillo</button>
                                <button onclick="SystemKernel.actualizarTriaje('${p.id}', 'Verde')" class="px-2 py-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded">Verde</button>
                            </div>
                        </div>

                        <!-- Sección Expandible de Expediente y Órdenes Clínicas -->
                        <div class="bg-slate-800 p-4 rounded-lg border border-slate-700 space-y-3">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <!-- Notas Clínicas Previas -->
                                <div>
                                    <span class="text-xs font-bold text-blue-300 block mb-1"><i class="fa-solid fa-notes-medical mr-1"></i> Notas de Evolución:</span>
                                    <ul class="text-xs text-slate-300 space-y-1 list-disc list-inside">
                                        ${p.notas && p.notas.length > 0 ? p.notas.map(n => `<li>${n}</li>`).join('') : '<li class="text-slate-500 italic">Sin notas registradas.</li>'}
                                    </ul>
                                </div>

                                <!-- Órdenes Clínicas Justificadas -->
                                <div>
                                    <span class="text-xs font-bold text-emerald-400 block mb-1"><i class="fa-solid fa-prescription-bottle-medical mr-1"></i> Órdenes Clínicas / Prescripciones:</span>
                                    <ul class="text-xs text-slate-300 space-y-1 list-disc list-inside">
                                        ${p.ordenes && p.ordenes.length > 0 ? p.ordenes.map(o => `<li><strong>${o.tipo}:</strong> ${o.detalle} <span class="text-slate-500 text-[10px]">(${o.justificacion})</span></li>`).join('') : '<li class="text-slate-500 italic">Sin órdenes emitidas.</li>'}
                                    </ul>
                                </div>
                            </div>

                            <!-- Formulario para agregar Orden Clínica Justificada -->
                            <div class="pt-3 border-t border-slate-700 space-y-2">
                                <span class="text-xs font-bold text-slate-300"><i class="fa-solid fa-plus-circle mr-1 text-blue-400"></i> Emitir Nueva Orden Clínica:</span>
                                <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                                    <select id="tipoOrden-${p.id}" class="bg-slate-900 border border-slate-700 rounded p-1.5 text-xs text-white">
                                        <option value="Laboratorio">Laboratorio</option>
                                        <option value="Imagenología (Rayos X / PACS)">Imagenología (Rayos X)</option>
                                        <option value="Farmacia / Medicamento">Farmacia (Dosis)</option>
                                        <option value="Interconsulta">Interconsulta</option>
                                    </select>
                                    <input type="text" id="detalleOrden-${p.id}" placeholder="Detalle (Ej. Hemograma completo / Paracetamol 500mg)" class="bg-slate-900 border border-slate-700 rounded p-1.5 text-xs text-white">
                                    <input type="text" id="justificacionOrden-${p.id}" placeholder="Justificación clínica (Ej. Sospecha de infección)" class="bg-slate-900 border border-slate-700 rounded p-1.5 text-xs text-white">
                                </div>
                                <div class="flex justify-end pt-1">
                                    <button onclick="guardarOrden('${p.id}')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-4 py-1.5 rounded font-bold transition">
                                        <i class="fa-solid fa-check mr-1"></i> Guardar y Enviar Orden
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
        }

        function guardarOrden(pacienteId) {
            const tipo = document.getElementById(`tipoOrden-${pacienteId}`).value;
            const detalle = document.getElementById(`detalleOrden-${pacienteId}`).value.trim();
            const justificacion = document.getElementById(`justificacionOrden-${pacienteId}`).value.trim();

            if (detalle && justificacion) {
                SystemKernel.agregarOrdenClinica(pacienteId, { tipo, detalle, justificacion });
                document.getElementById(`detalleOrden-${pacienteId}`).value = '';
                document.getElementById(`justificacionOrden-${pacienteId}`).value = '';
                alert('Orden clínica emitida y justificada con éxito.');
            } else {
                alert('Por favor complete tanto el detalle de la orden como su justificación clínica.');
            }
        }

        document.getElementById('formPaciente').addEventListener('submit', (e) => {
            e.preventDefault();
            const nombre = document.getElementById('nombreInput').value;
            const triaje = document.getElementById('triajeInput').value;
            const cama = document.getElementById('camaInput').value;
            const nuevoId = 'HC-' + Math.floor(100000 + Math.random() * 900000);

            SystemKernel.agregarPaciente({
                id: nuevoId,
                nombre: nombre,
                triaje: triaje,
                cama: cama,
                estado: 'Hospitalizado',
                diagnostico: 'Evaluación inicial',
                notas: ['Ingreso registrado por admisiones.'],
                ordenes: []
            });

            e.target.reset();
            alert('Paciente registrado con éxito.');
        });

        window.addEventListener('kernelUpdated', renderMedTrack);
        document.addEventListener('DOMContentLoaded', renderMedTrack);
    </script>
</body>
</html>
